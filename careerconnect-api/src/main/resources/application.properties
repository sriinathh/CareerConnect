# =============================================================================
# CareerConnect Application Properties (Base Configuration)
# =============================================================================

spring.application.name=careerconnect-api

# Active Spring Profile (default: local with H2, or dev/prod with PostgreSQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.shutdown=graceful

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careerconnect_db}
spring.datasource.username=${DB_USERNAME:careerconnect_user}
spring.datasource.password=${DB_PASSWORD:careerconnect_secure_password_2026}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
# In production, Flyway handles migrations, so ddl-auto is validate or none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Multipart / File Upload Settings (Resumes)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Spring Boot Actuator & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# CareerConnect Custom JWT Configuration
app.jwt.secret=${JWT_SECRET:careerconnect_super_secret_jwt_key_with_at_least_256_bits_length_cse_project_2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CareerConnect CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# CareerConnect File Storage
app.file-upload.dir=${FILE_UPLOAD_DIR:./uploads/resumes}
