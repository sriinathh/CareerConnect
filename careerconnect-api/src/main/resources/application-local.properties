# =============================================================================
# CareerConnect Application Properties (Profile: local)
# Fast, zero-configuration in-memory database with H2 (PostgreSQL compatibility mode)
# =============================================================================

spring.datasource.url=jdbc:h2:mem:careerconnect_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL in local profile automatically creates/updates schema based on JPA Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway disabled in local profile because Hibernate manages H2 in-memory tables
spring.flyway.enabled=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
