version: '3.8'

services:
  # =============================================================================
  # PostgreSQL Database Service
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: careerconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careerconnect_db
      POSTGRES_USER: careerconnect_user
      POSTGRES_PASSWORD: careerconnect_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerconnect_user -d careerconnect_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - careerconnect-network

  # =============================================================================
  # Spring Boot REST API Service
  # =============================================================================
  careerconnect-api:
    build:
      context: ./careerconnect-api
      dockerfile: Dockerfile
    container_name: careerconnect-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: careerconnect_db
      DB_USERNAME: careerconnect_user
      DB_PASSWORD: careerconnect_secure_password_2026
      JWT_SECRET: careerconnect_super_secret_jwt_key_with_at_least_256_bits_length_cse_project_2026
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - careerconnect-network

  # =============================================================================
  # React + Vite Frontend Service
  # =============================================================================
  careerconnect-ui:
    build:
      context: ./careerconnect-ui
      dockerfile: Dockerfile
    container_name: careerconnect-ui
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      - careerconnect-api
    networks:
      - careerconnect-network

volumes:
  postgres_data:
    name: careerconnect_postgres_data

networks:
  careerconnect-network:
    name: careerconnect-network
    driver: bridge
